name: Quality gates

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  verify:
    name: Full launch verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      TZ: Asia/Shanghai
      REPORT_TIME_ZONE: Asia/Shanghai
      PUBLIC_SITE_URL: https://dmvcn.com/
      PUBLIC_CONTACT_EMAIL: nwekechibuike1@gmail.com

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run all publication gates
        run: npm run verify:launch
