name: Official source audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/official-source-audit.yml
  schedule:
    - cron: '43 7 1,15 * *'

permissions:
  contents: read

concurrency:
  group: official-source-audit
  cancel-in-progress: false

jobs:
  verify:
    name: Live government-source verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      TZ: Asia/Shanghai
      REPORT_TIME_ZONE: Asia/Shanghai
      LINK_AUDIT_FORCE: '1'
      LINK_AUDIT_LIMIT: '0'
      LINK_AUDIT_STRICT: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check every registered government URL
        run: npm run audit:links:full

      - name: Verify current source coverage
        run: npm run audit:source-freshness

      - name: Add audit report to job summary
        if: always()
        run: |
          if [[ -f reports/official-link-audit.md ]]; then
            cat reports/official-link-audit.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-source-audit-${{ github.run_id }}
          path: |
            reports/official-link-audit.json
            reports/official-link-audit.md
            reports/private/official-link-audit-cache.json
          if-no-files-found: error
          retention-days: 45
